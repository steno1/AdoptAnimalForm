<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A form to adopt your favorite animal with a clean, responsive design.">
  <title>Adopt Your Favorite Animal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Adopt Your Favorite Animal</h1>
    </header>

    <section>
      <form action="#" method="POST">
        <!-- User's name -->
        <div class="form-group">
          <label for="name" class="label">Your Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <!-- Animal selection -->
        <div class="form-group">
          <label for="animal" class="label">Select an Animal:</label>
          <select id="animal" name="animal" required>
            <option value="">-- Choose an Animal --</option>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="rabbit">Rabbit</option>
            <option value="pigeon">Pigeon</option>
            <option value="dove">Dove</option>
          </select>
        </div>

        <!-- Reason for adoption -->
        <div class="form-group">
          <label for="reason" class="label">Why do you want to adopt this animal?</label>
          <textarea id="reason" name="reason" rows="4" placeholder="Write your reason here..." required></textarea>
        </div>

        <!-- Submit button -->
        <div class="form-group">
          <button type="submit">Submit</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
